<!-- Accent "summon" variant of the mark: glowing indigo→violet `{ 塔 }`, for OGP / splash /
     empty states. Fixed colors (not currentColor) since it is a standalone illustrative
     asset, not the theme-following in-app mark. Transparent background; sits on any dark surface. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="syokan">
  <defs>
    <linearGradient id="sigilMagic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="sigilAura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="sigilGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="42" fill="url(#sigilAura)"/>
  <g filter="url(#sigilGlow)">
    <g stroke="url(#sigilMagic)" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M32 15 C24 15,24 21,24 31 L24 42 C24 45,23 46.5,21 48 L13.5 53 L21 58 C23 59.5,24 61,24 64 L24 75 C24 85,24 91,32 91"/>
      <path d="M68 15 C76 15,76 21,76 31 L76 42 C76 45,77 46.5,79 48 L86.5 53 L79 58 C77 59.5,76 61,76 64 L76 75 C76 85,76 91,68 91"/>
    </g>
    <path d="M50 13 L58.5 21.5 L58.5 28.5 L50 20 L41.5 28.5 L41.5 21.5 Z M41 31.5 H59 V49 H41 Z M47.25 37.5 H52.75 V43 H47.25 Z M36 53 H64 V70 H36 Z M41.5 58.5 H58.5 V64.5 H41.5 Z M36 74 H64 V91 H36 Z M41.5 79.5 H58.5 V85.5 H41.5 Z" fill="url(#sigilMagic)" fill-rule="evenodd"/>
  </g>
</svg>
