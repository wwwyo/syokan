<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>syokan</title>
    <meta
      name="description"
      content="Syokan (summon) UI on the spot — post JSON, not JSX."
    />
    <!-- Open Graph / Twitter card for link unfurls. og:image must be absolute; the JPEG is
         copied into the asset dir by build.ts and served at /og-image.jpg. Generic brand card
         (share pages are an SPA on one HTML, so per-snapshot images aren't wired). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="syokan" />
    <meta property="og:title" content="syokan" />
    <meta
      property="og:description"
      content="Syokan (summon) UI on the spot — post JSON, not JSX."
    />
    <!-- No og:url: the same static HTML backs both / and /shares/:id, so a fixed canonical
         would collapse every share's unfurl to the root. Omitting it lets unfurlers use the
         actual request URL while still showing the generic brand card below. -->
    <meta property="og:image" content="https://syokan.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="syokan" />
    <meta
      name="twitter:description"
      content="Syokan (summon) UI on the spot — post JSON, not JSX."
    />
    <meta name="twitter:image" content="https://syokan.dev/og-image.jpg" />
    <!-- Favicon set. The SVG (theme-aware via prefers-color-scheme) is primary for modern
         browsers; the .ico (legacy fallback) and apple-touch-icon (opaque iOS tile) links are
         injected by build.ts — Bun's HTML bundler would try to resolve their file-path hrefs at
         build time, so they can't live here. The SVG data URI is kept in sync with
         apps/syokan/index.html by eye. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cstyle%3E%2A%7B--c:%23141414%7D@media(prefers-color-scheme:dark)%7B%2A%7B--c:%23fafafa%7D%7D%3C/style%3E%3Cg%20fill='none'%20stroke='var(--c)'%20stroke-width='10'%20stroke-linecap='butt'%20stroke-linejoin='miter'%3E%3Cpath%20d='M32%2015%20C24%2015%2024%2021%2024%2031%20L24%2042%20C24%2045%2023%2046.5%2021%2048%20L13.5%2053%20L21%2058%20C23%2059.5%2024%2061%2024%2064%20L24%2075%20C24%2085%2024%2091%2032%2091'/%3E%3Cpath%20d='M68%2015%20C76%2015%2076%2021%2076%2031%20L76%2042%20C76%2045%2077%2046.5%2079%2048%20L86.5%2053%20L79%2058%20C77%2059.5%2076%2061%2076%2064%20L76%2075%20C76%2085%2076%2091%2068%2091'/%3E%3C/g%3E%3Cpath%20d='M50%2013%20L58.5%2021.5%20L58.5%2028.5%20L50%2020%20L41.5%2028.5%20L41.5%2021.5%20Z%20M41%2031.5%20H59%20V49%20H41%20Z%20M46.5%2036.5%20H53.5%20V44%20H46.5%20Z%20M36%2053%20H64%20V70%20H36%20Z%20M41%2057.5%20H59%20V65.5%20H41%20Z%20M36%2074%20H64%20V91%20H36%20Z%20M41%2078.5%20H59%20V86.5%20H41%20Z'%20fill='var(--c)'%20fill-rule='evenodd'/%3E%3C/svg%3E"
    />
    <script>
      // viewer に設定 UI はないので OS 設定のみに追従する
      (function () {
        var mq = matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          document.documentElement.classList.toggle("dark", mq.matches);
        };
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
    <link rel="stylesheet" href="../../syokan/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
