scripts:
  # The sync is best-effort: `{ ...; }` propagates its last command's exit
  # status, so `|| true` inside the group is what keeps a failing sync from
  # blocking `bun install` past `&&`. Only dropping `|| true` re-breaks this
  # (`;` for `&&` or `|| true` outside the braces is equivalent); `&&` stays
  # so a future guard regression blocks setup loudly instead of silently.
  setup: '{ [ ! -x "$HOME/src/github.com/wwwyo/dotfiles/.agents/skills/project-setup/tools/sync-local-worktree-files.sh" ] || "$HOME/src/github.com/wwwyo/dotfiles/.agents/skills/project-setup/tools/sync-local-worktree-files.sh" || true; } && bun install'
